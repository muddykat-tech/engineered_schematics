plugins {
    id 'idea'
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.2'
}

ext.configFile = file '../common/common-1.12.properties'

configFile.withReader {
    def prop = new Properties()
    prop.load(it)
    ext.common = new ConfigSlurper().parse prop
}

def versionProps = new Properties()
file('version.properties').withInputStream { versionProps.load(it) }

def gradleProps = new Properties()
file('gradle.properties').withInputStream { gradleProps.load(it) }

def building = gradle.startParameter.taskNames*.toLowerCase().any { it.contains('build') || it.contains('jar') || it.contains('assemble') }
if (building) {
    versionProps['build_number'] = ((versionProps.getProperty('build_number')?.toInteger() ?: 0) + 1).toString()
    file('version.properties').withOutputStream { versionProps.store(it, null) }
}

ext.modversion = versionProps.getProperty('version')
ext.version_buildnumber = versionProps.getProperty('build_number')?.toInteger() ?: 0
ext.stage = versionProps.getProperty('stage') ?: ''

version = "${common.mcversion}-${modversion}.${version_buildnumber}-${stage}"

println "-> build.gradle applying version: $version"

group = modgroup

ext {
    mod_id = gradleProps['mod_id']
    mod_name = gradleProps['mod_name']
    mod_authors = gradleProps['mod_authors']
    mod_description = gradleProps['mod_description']
    mod_url = gradleProps['mod_url']
}

base { archivesName = modarchivename }

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
        vendor = JvmVendorSpec.ADOPTIUM
    }
}

minecraft {
    mcVersion = '1.12.2'
    mcpMappingChannel = 'stable'
    mcpMappingVersion = common.mcp_mappings.toString().split('-')[0]
    username = 'Muddykat'
    extraRunJvmArguments.addAll(
            '-Xmx4G',
            '-Dforge.logging.console.level=debug'
    )
}

repositories {
    maven {
        url = "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven { url = 'https://jitpack.io' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    maven { url = 'https://maven.minecraftforge.net' }
    maven { url = 'https://maven.cleanroommc.com' }
    mavenCentral()
}

configurations {
    clientRuntime {
        canBeConsumed = false
        canBeResolved = true
    }
}

def icJar = null
def icDir = file('../ImmersiveConvergence-Legacy/build/libs')
def icJars = icDir.exists() ? fileTree(icDir) {
    include '*-dev.jar'
    exclude '**/*-sources.jar'
}.files : []

if (!icJars.isEmpty()) {
    icJar = icJars.sort { a, b -> a.lastModified() <=> b.lastModified() }.last()
    logger.lifecycle("Found Immersive Convergence dev JAR: ${icJar.name}")
} else {
    logger.warn('No Immersive Convergence dev JAR found in ../ImmersiveConvergence-Legacy/build/libs, build one there first')
}

def itJar = null
def itDir = file('../MCT-Immersive-Technology-Legacy/build/libs')
def itJars = itDir.exists() ? fileTree(itDir) {
    include '*-dev.jar'
    exclude '**/*-sources.jar'
}.files : []

if (!itJars.isEmpty()) {
    itJar = itJars.sort { a, b -> a.lastModified() <=> b.lastModified() }.last()
    logger.lifecycle("Found Immersive Technology dev JAR: ${itJar.name}")
} else {
    logger.warn('No Immersive Technology dev JAR found in ../MCT-Immersive-Technology-Legacy/build/libs, build one there first')
}

dependencies {
    implementation rfg.deobf("curse.maven:${common.imme_version}")
    implementation rfg.deobf("curse.maven:${common.imps_version}")
    implementation rfg.deobf("curse.maven:${common.imin_version}")
    if (icJar != null) {
        implementation files(icJar)
    }
    if (itJar != null) {
        implementation files(itJar)
    }
    runtimeOnly('zone.rong:mixinbooter:10.7') { transitive = false }

    clientRuntime rfg.deobf("curse.maven:${common.bf3r_version}")
}

tasks.named('runClient').configure {
    extraArgs.addAll('--width', '1920', '--height', '1080')
    classpath configurations.clientRuntime
}

tasks.named('runServer').configure {
    workingDir = file('run/server')
}

processResources {
    inputs.property('version', providers.provider { "${modversion}.${version_buildnumber}" })
    inputs.property 'mcversion', common.mcversion
    filesMatching(['mcmod.info', 'pack.mcmeta']) {
        expand 'version': "${modversion}.${version_buildnumber}", 'mcversion': common.mcversion,
                'mod_id': mod_id, 'mod_name': mod_name,
                'mod_authors': mod_authors, 'mod_description': mod_description,
                'mod_url': mod_url
    }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

sourceSets.configureEach { it.output.resourcesDir = it.output.classesDirs.getFiles().iterator().next() }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
